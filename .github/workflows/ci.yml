name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - name: Unit tests (Windows-only cases auto-skip)
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Publication check
        run: python tools/check_publication.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build both bridge DLLs
        shell: pwsh
        run: ./native/build_bridges.ps1 -Target all
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Config and plugin syntax check
        run: |
          python tools/init_config.py
          python main.py --check
      - name: Publication check (after cleaning build and test artifacts)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force native/.build -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          python tools/check_publication.py
