<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<script>
  (() => {
    try {
      const saved = localStorage.getItem('admin-theme');
      const dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (_) {
      document.documentElement.dataset.theme = 'light';
    }
  })();
</script>
<title>微信机器人管理台</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="refresh.css">
</head>
<body>
  <button id="skip-link" class="skip-link" type="button">跳到主要内容</button>

  <!-- 窄屏才出现的顶栏：里面只有一个抽屉开关 -->
  <header class="topbar">
    <button id="nav-toggle" class="icon-btn nav-toggle" type="button"
            aria-expanded="false" aria-controls="sidebar" aria-label="打开导航">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="topbar-title">微信机器人管理台</span>
  </header>

  <aside id="sidebar" class="sidebar" aria-label="主导航">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" focusable="false">
          <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.9 8.9 0 0 1-3.2-.6L3 21l1.7-5.1a8.4 8.4 0 1 1 16.3-4.4Z"/>
          <path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01"/>
        </svg>
      </span>
      <span class="brand-text">微信机器人管理台</span>
      <button id="nav-close" class="icon-btn nav-close" type="button" aria-label="收起导航">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <nav id="nav-tree" class="nav-tree" aria-label="页面导航"></nav>
    <div class="sidebar-foot">
      <div class="foot-status"><span class="status-dot" aria-hidden="true"></span><span>本地运行 · 127.0.0.1</span></div>
      <div class="foot-actions">
        <span class="foot-note">与机器人同进程</span>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换到深色主题" aria-pressed="false">
          <svg class="icon theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/>
          </svg>
          <svg class="icon theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>
  <div id="nav-scrim" class="nav-scrim" aria-hidden="true" hidden></div>

  <main id="main" class="main" tabindex="-1"></main>

  <!-- 页面脚本未捕获的异常落在这里，避免「白屏了但不知道哪里错」 -->
  <div id="js-error" class="js-error" role="alert" hidden></div>

  <script src="app.js"></script>
</body>
</html>
